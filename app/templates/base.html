<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Sumar{% endblock %} — Inventar stații AD</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="{{ url_for('dashboard') }}">Inventar AD</a>
    <nav class="mainnav">
      <a href="{{ url_for('dashboard') }}" class="{{ 'active' if request.endpoint == 'dashboard' else '' }}">Sumar</a>
      <a href="{{ url_for('stations') }}" class="{{ 'active' if request.endpoint == 'stations' else '' }}">Stații</a>
      <a href="{{ url_for('software') }}" class="{{ 'active' if request.endpoint == 'software' else '' }}">Software</a>
      <a href="{{ url_for('alerte') }}" class="{{ 'active' if request.endpoint == 'alerte' else '' }}">Alerte</a>
      <a href="{{ url_for('rulari') }}" class="{{ 'active' if request.endpoint == 'rulari' else '' }}">Rulări</a>
    </nav>
    <div class="scan-widget">
      <form id="scan-form" class="scan-form">
        <select name="level" id="scan-level" title="Nivel de colectare">
          <option value="1">Nivel 1</option>
          <option value="2">Nivel 2</option>
        </select>
        <div class="ou-picker-wrap">
          <input type="text" name="ou_base" id="scan-ou" placeholder="OU (implicit: auto)">
          <button type="button" id="ou-picker-toggle" class="btn-secondary" title="Alege OU din AD">Alege OU…</button>
          <div id="ou-picker-panel" class="ou-picker-panel" hidden>
            <p class="ou-picker-hint">
              Click pe un sub-OU ca să intri în el; „Selectează” alege OU-ul afișat ca bază de scanare.
            </p>
            <div id="ou-picker-breadcrumb" class="ou-picker-breadcrumb"></div>
            <div id="ou-picker-current-card" class="ou-current-card"></div>
            <div id="ou-picker-list" class="ou-picker-list"></div>
            <p id="ou-picker-error" class="scan-error" hidden></p>
          </div>
        </div>
        <div class="scan-elevate-wrap">
          <button type="button" id="elevate-toggle" class="link-more">Alt cont AD…</button>
          <div id="elevate-fields" class="elevate-fields" hidden>
            <input type="text" id="scan-admin-user" placeholder="DOMENIU\user" autocomplete="off">
            <input type="password" id="scan-admin-pass" placeholder="Parolă" autocomplete="new-password">
          </div>
        </div>
        <button type="submit" id="scan-start-btn">Pornește scanarea</button>
        <button type="button" id="scan-stop-btn" class="btn-secondary" hidden>Oprește</button>
      </form>
      <div id="scan-progress" class="scan-progress" hidden>
        <div class="scan-progress-track"><div class="scan-progress-fill" id="scan-progress-fill"></div></div>
        <span id="scan-progress-text" class="scan-progress-text"></span>
      </div>
      <p id="scan-error" class="scan-error" hidden></p>
    </div>
  </div>
</header>
<main class="content">
  {% block content %}{% endblock %}
</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
